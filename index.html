<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cipísek – Průvodce &amp; Deník</title>
  <meta name="description" content="Rodinný deník a průvodce pro pyrenejského horského psa: procházky, výchova, váha a veterina.">
  <meta name="theme-color" content="#1b5a4c" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f171b" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* barva aplikace a vzhled hned na začátku, ať nic neproblikne */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('cipisek.settings.v1') || '{}'), r = document.documentElement;
        if (s.theme === 'light' || s.theme === 'dark') r.dataset.theme = s.theme;
        var A = { a: ['#3f7fcf', '#1b4b8f', '#fff'], b: ['#f1a23a', '#c2691a', '#fff'], c: ['#8b6fd6', '#4d3a9a', '#fff'], e: ['#2a2f36', '#0e1114', '#f5c66b'], f: ['#bfeadb', '#8fd3bd', '#17493d'] }[s.accent];
        if (A) {
          r.dataset.accent = s.accent;
          r.style.setProperty('--boot1', A[0]); r.style.setProperty('--boot2', A[1]); r.style.setProperty('--boot-fg', A[2]);
          document.querySelector('link[rel=manifest]').href = 'manifest-' + s.accent + '.webmanifest';
          document.querySelector('link[rel=icon]').href = 'icons/' + s.accent + '/icon.svg';
          document.querySelector('link[rel=apple-touch-icon]').href = 'icons/' + s.accent + '/apple-touch-icon.png';
        }
      } catch (e) {}
    })();
  </script>
  <style>
    /* úvodní obrazovka s animací – nezávislá na ostatních stylech, ať je vidět hned */
    #boot { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; overflow: hidden;
      background: linear-gradient(var(--boot1, #2b7a66), var(--boot2, #164a3e)); color: var(--boot-fg, #fff); transition: opacity .4s ease, visibility .4s; font-family: system-ui, sans-serif; }
    #boot.done { opacity: 0; visibility: hidden; }
    #boot .hills { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 38%; opacity: .16; fill: #000; }
    #boot .hills.back { opacity: .10; fill: #fff; height: 46%; }
    #boot .stage { position: relative; width: 210px; height: 230px; display: grid; place-items: start center; }
    #boot .dog { width: 210px; height: 210px; transform-origin: 50% 100%; animation: bootHop 1.5s cubic-bezier(.3,.7,.4,1) infinite; overflow: visible; }
    #boot .shadow { position: absolute; bottom: 4px; left: 50%; width: 120px; height: 16px; margin-left: -60px; border-radius: 50%; background: rgba(0,0,0,.28); animation: bootShadow 1.5s cubic-bezier(.3,.7,.4,1) infinite; }
    #boot .ear { transform-box: fill-box; transform-origin: 50% 0%; }
    #boot .ear-l { animation: earL 1.5s ease-in-out infinite; } #boot .ear-r { animation: earR 1.5s ease-in-out infinite; }
    #boot .eye { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 3s infinite; }
    #boot .tongue { transform-box: fill-box; transform-origin: 50% 0%; animation: pant .5s ease-in-out infinite alternate; }
    #boot b { font-size: 1.6rem; letter-spacing: -.02em; }
    #boot .bootsteps { display: flex; gap: 10px; height: 30px; align-items: center; }
    #boot .bootsteps svg { width: 22px; height: 22px; fill: currentColor; opacity: 0; animation: bootStep 1.8s ease-in-out infinite; }
    #boot .bootsteps svg:nth-child(odd) { transform: translateY(6px) rotate(-14deg); }
    #boot .bootsteps svg:nth-child(even) { transform: translateY(-4px) rotate(14deg); }
    #boot .bootsteps svg:nth-child(2) { animation-delay: .25s; } #boot .bootsteps svg:nth-child(3) { animation-delay: .5s; } #boot .bootsteps svg:nth-child(4) { animation-delay: .75s; }
    #boot .bootsteps svg:nth-child(5) { animation-delay: 1s; } #boot .bootsteps svg:nth-child(6) { animation-delay: 1.25s; }
    #boot p { margin: 0; font-size: .9rem; opacity: .8; max-width: 260px; text-align: center; min-height: 1.3em; }
    @keyframes bootHop { 0%, 100% { transform: translateY(0) scale(1.04, .96); } 45% { transform: translateY(-26px) scale(.97, 1.03); } 60% { transform: translateY(-26px) scale(.97, 1.03); } 85% { transform: translateY(0) scale(1.04, .96); } }
    @keyframes bootShadow { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.6); opacity: .5; } }
    @keyframes earL { 0%, 100% { transform: rotate(0); } 45%, 60% { transform: rotate(14deg); } }
    @keyframes earR { 0%, 100% { transform: rotate(0); } 45%, 60% { transform: rotate(-14deg); } }
    @keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.08); } }
    @keyframes pant { from { transform: scaleY(.85); } to { transform: scaleY(1.15); } }
    @keyframes bootStep { 0% { opacity: 0; } 25%, 60% { opacity: .95; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { #boot .dog, #boot .shadow, #boot .ear, #boot .eye, #boot .tongue, #boot .bootsteps svg { animation: none; } #boot .bootsteps svg { opacity: .9; } }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-live="polite">

    <div class="stage"><svg class="dog" viewBox="20 40 360 360" aria-hidden="true">
  <circle cx="200" cy="230" r="172" fill="#000" opacity=".16"/>

    <circle cx="150" cy="340" r="42"/><circle cx="250" cy="340" r="42"/><circle cx="200" cy="352" r="46"/>

  <!-- uši: malé, sklopené, žlutošedé -->
  <g class="ear ear-l"><path d="M124 100C84 92 56 138 66 198c4 24 30 20 46-6 12-20 20-60 12-92z" fill="#c9a36a"/><path d="M112 118c-16 6-28 36-24 64" stroke="#a9834d" stroke-width="5" stroke-linecap="round" fill="none" opacity=".5"/></g>
  <g class="ear ear-r"><path d="M276 100c40-8 68 38 58 98-4 24-30 20-46-6-12-20-20-60-12-92z" fill="#c9a36a"/><path d="M288 118c16 6 28 36 24 64" stroke="#a9834d" stroke-width="5" stroke-linecap="round" fill="none" opacity=".5"/></g>
  <!-- hlava -->
  <path d="M200 66c72 0 98 52 94 112-3 46-26 80-46 108-14 20-34 28-48 28s-34-8-48-28c-20-28-43-62-46-108-4-60 22-112 94-112z" fill="#fff" stroke="#dde5e9" stroke-width="3"/>
  <!-- jezevčí znaky po stranách hlavy, uprostřed bílá lysina -->
  <path d="M112 114C126 84 156 68 186 66c-2 24-8 42-18 60-20-16-38-14-56-12z" fill="#d6b98a"/>
  <path d="M288 114C274 84 244 68 214 66c2 24 8 42 18 60 20-16 38-14 56-12z" fill="#d6b98a"/>
  <!-- chlupatější tváře -->
  <g fill="#fff"><circle cx="106" cy="214" r="15"/><circle cx="294" cy="214" r="15"/><circle cx="116" cy="250" r="16"/><circle cx="284" cy="250" r="16"/><circle cx="134" cy="282" r="14"/><circle cx="266" cy="282" r="14"/></g>
  <!-- tlama -->
  <ellipse cx="200" cy="268" rx="52" ry="42" fill="#f1f4f6"/>
  <!-- oči: tmavé, mandlové -->
  <g class="eye"><ellipse cx="156" cy="174" rx="12" ry="8.5" fill="#2a1d14" transform="rotate(10 156 174)"/><circle cx="160" cy="171" r="3" fill="#fff"/></g>
  <g class="eye"><ellipse cx="244" cy="174" rx="12" ry="8.5" fill="#2a1d14" transform="rotate(-10 244 174)"/><circle cx="248" cy="171" r="3" fill="#fff"/></g>
  <!-- nos a pusa -->
  <path d="M174 238c0-10 12-16 26-16s26 6 26 16c0 12-14 22-26 22s-26-10-26-22z" fill="#1c1a1a"/><ellipse cx="190" cy="232" rx="8" ry="3.6" fill="#fff" opacity=".3"/>
  <path d="M200 260v16" stroke="#1c1a1a" stroke-width="5" stroke-linecap="round"/>
  <path d="M166 280c10 14 22 18 34 18s24-4 34-18" stroke="#1c1a1a" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path class="tongue" d="M184 292c1 18 9 26 16 26s15-8 16-26c-10 5-22 5-32 0z" fill="#ef7c8e"/>
</svg><span class="shadow"></span></div>
    <b>Cipísek</b>
    <div class="bootsteps"><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16" rx="4.6" ry="3.8"/><ellipse cx="5.6" cy="11" rx="1.9" ry="2.5"/><ellipse cx="9.4" cy="6.8" rx="2" ry="2.7"/><ellipse cx="14.6" cy="6.8" rx="2" ry="2.7"/><ellipse cx="18.4" cy="11" rx="1.9" ry="2.5"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16" rx="4.6" ry="3.8"/><ellipse cx="5.6" cy="11" rx="1.9" ry="2.5"/><ellipse cx="9.4" cy="6.8" rx="2" ry="2.7"/><ellipse cx="14.6" cy="6.8" rx="2" ry="2.7"/><ellipse cx="18.4" cy="11" rx="1.9" ry="2.5"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16" rx="4.6" ry="3.8"/><ellipse cx="5.6" cy="11" rx="1.9" ry="2.5"/><ellipse cx="9.4" cy="6.8" rx="2" ry="2.7"/><ellipse cx="14.6" cy="6.8" rx="2" ry="2.7"/><ellipse cx="18.4" cy="11" rx="1.9" ry="2.5"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16" rx="4.6" ry="3.8"/><ellipse cx="5.6" cy="11" rx="1.9" ry="2.5"/><ellipse cx="9.4" cy="6.8" rx="2" ry="2.7"/><ellipse cx="14.6" cy="6.8" rx="2" ry="2.7"/><ellipse cx="18.4" cy="11" rx="1.9" ry="2.5"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16" rx="4.6" ry="3.8"/><ellipse cx="5.6" cy="11" rx="1.9" ry="2.5"/><ellipse cx="9.4" cy="6.8" rx="2" ry="2.7"/><ellipse cx="14.6" cy="6.8" rx="2" ry="2.7"/><ellipse cx="18.4" cy="11" rx="1.9" ry="2.5"/></svg><svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16" rx="4.6" ry="3.8"/><ellipse cx="5.6" cy="11" rx="1.9" ry="2.5"/><ellipse cx="9.4" cy="6.8" rx="2" ry="2.7"/><ellipse cx="14.6" cy="6.8" rx="2" ry="2.7"/><ellipse cx="18.4" cy="11" rx="1.9" ry="2.5"/></svg></div>
    <p id="bootMsg">Načítám…</p>
  </div>
  <script>setTimeout(function () { var b = document.getElementById('boot'), m = document.getElementById('bootMsg'); if (b && !b.classList.contains('done') && m) m.textContent = 'Načítání trvá dlouho. Zavři aplikaci a otevři ji znovu.'; }, 9000);</script>

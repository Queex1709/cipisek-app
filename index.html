<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cipísek – Průvodce &amp; Deník</title>
  <meta name="description" content="Rodinný deník a průvodce pro pyrenejského horského psa: procházky, výchova, váha a veterina.">
  <meta name="theme-color" content="#1b5a4c" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f171b" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/bricolage-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
  <script>
    /* barva aplikace a vzhled hned na začátku, ať nic neproblikne */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('cipisek.settings.v1') || '{}'), r = document.documentElement;
        if (s.theme === 'light' || s.theme === 'dark') r.dataset.theme = s.theme;
        var A = { a: ['#3f7fcf', '#1b4b8f', '#fff'], b: ['#f1a23a', '#c2691a', '#fff'], c: ['#8b6fd6', '#4d3a9a', '#fff'], e: ['#2a2f36', '#0e1114', '#f5c66b'], f: ['#bfeadb', '#8fd3bd', '#17493d'] }[s.accent];
        if (A) {
          r.dataset.accent = s.accent;
          r.style.setProperty('--boot1', A[0]); r.style.setProperty('--boot2', A[1]); r.style.setProperty('--boot-fg', A[2]);
          document.querySelector('link[rel=manifest]').href = 'manifest-' + s.accent + '.webmanifest';
          document.querySelector('link[rel=icon]').href = 'icons/' + s.accent + '/icon.svg';
          document.querySelector('link[rel=apple-touch-icon]').href = 'icons/' + s.accent + '/apple-touch-icon.png';
        }
      } catch (e) {}
    })();
  </script>
  <style>
    /* úvodní obrazovka s animací – nezávislá na ostatních stylech, ať je vidět hned */
    #boot { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; overflow: hidden;
      background: linear-gradient(var(--boot1, #2b7a66), var(--boot2, #164a3e)); color: var(--boot-fg, #fff); transition: opacity .4s ease, visibility .4s; font-family: system-ui, sans-serif; }
    #boot.done { opacity: 0; visibility: hidden; }
    #boot .hills { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 38%; opacity: .16; fill: #000; }
    #boot .hills.back { opacity: .10; fill: #fff; height: 46%; }
    #boot .stage { position: relative; width: 240px; height: 240px; display: grid; place-items: center; }
    #boot .ring { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 3px solid currentColor; opacity: 0; animation: bootRing 2.1s ease-out infinite; }
    #boot .ring:nth-child(2) { animation-delay: .7s; } #boot .ring:nth-child(3) { animation-delay: 1.4s; }
    #boot .bigpaw { position: relative; width: 112px; height: 112px; fill: currentColor; animation: bootStamp 2.1s cubic-bezier(.3,.8,.3,1) infinite; filter: drop-shadow(0 8px 14px rgba(0,0,0,.25)); }
    #boot b { font-size: 1.6rem; letter-spacing: -.02em; }
    #boot .dots { display: flex; gap: 8px; height: 14px; align-items: center; }
    #boot .dots i { width: 9px; height: 9px; border-radius: 50%; background: currentColor; opacity: .5; animation: bootDot 1.1s ease-in-out infinite; }
    #boot .dots i:nth-child(2) { animation-delay: .15s; } #boot .dots i:nth-child(3) { animation-delay: .3s; }
    #boot p { margin: 0; font-size: .9rem; opacity: .8; max-width: 260px; text-align: center; min-height: 1.3em; }
    @keyframes bootStamp { 0%, 100% { transform: scale(1) rotate(-6deg); } 12% { transform: scale(1.3) rotate(-6deg); } 28% { transform: scale(.94) rotate(-6deg); } 42% { transform: scale(1) rotate(-6deg); } }
    @keyframes bootRing { 0%, 12% { transform: scale(.7); opacity: 0; } 18% { opacity: .55; } 100% { transform: scale(2.1); opacity: 0; } }
    @keyframes bootDot { 0%, 100% { transform: translateY(0); opacity: .45; } 40% { transform: translateY(-7px); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { #boot .bigpaw, #boot .ring, #boot .dots i { animation: none; } #boot .ring { opacity: .25; } }
  </style>
</head>
<body>
  <div id="boot" role="status" aria-live="polite">
    <svg class="hills back" viewBox="0 0 400 200" preserveAspectRatio="none" aria-hidden="true"><path d="M0 200V90l70-50 60 60 80-80 90 90 60-40 40 30v100z"/></svg><svg class="hills" viewBox="0 0 400 200" preserveAspectRatio="none" aria-hidden="true"><path d="M0 200V120l90-60 70 50 70-70 80 80 90-40v120z"/></svg>
    <div class="stage"><span class="ring"></span><span class="ring"></span><span class="ring"></span><svg class="bigpaw" viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="16" rx="4.6" ry="3.8"/><ellipse cx="5.6" cy="11" rx="1.9" ry="2.5"/><ellipse cx="9.4" cy="6.8" rx="2" ry="2.7"/><ellipse cx="14.6" cy="6.8" rx="2" ry="2.7"/><ellipse cx="18.4" cy="11" rx="1.9" ry="2.5"/></svg></div>
    <b>Cipísek</b>
    <div class="dots"><i></i><i></i><i></i></div>
    <p id="bootMsg">Načítám…</p>
  </div>
  <script>setTimeout(function () { var b = document.getElementById('boot'), m = document.getElementById('bootMsg'); if (b && !b.classList.contains('done') && m) m.textContent = 'Načítání trvá dlouho. Zavři aplikaci a otevři ji znovu.'; }, 9000);</script>
  <div id="app">
    <header class="topbar">
      <a class="brand" href="#/dnes" aria-label="Domů">
        <span id="logo" class="logo"></span>
        <span id="brand-name" class="brand-name">Cipísek</span>
      </a>
      <div class="top-actions">
        <a id="recPill" class="rec-pill" href="#/prochazky" hidden><i></i><span id="recTxt"></span></a>
        <button id="syncDot" class="sync-dot" hidden type="button"></button>
        <button id="help" class="icon-btn" type="button" aria-label="Nápověda"></button>
        <a id="gear" class="icon-btn" href="#/nastaveni" aria-label="Nastavení"></a>
      </div>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <nav id="nav" class="tabbar" aria-label="Hlavní navigace"></nav>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <noscript>Aplikace potřebuje zapnutý JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>

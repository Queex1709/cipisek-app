<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cipísek – Průvodce &amp; Deník</title>
  <meta name="description" content="Rodinný deník a průvodce pro pyrenejského horského psa: procházky, výchova, váha a veterina.">
  <meta name="theme-color" content="#1b5a4c" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f171b" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

      <div class="top-actions">

    <main id="view" class="view" tabindex="-1"></main>
